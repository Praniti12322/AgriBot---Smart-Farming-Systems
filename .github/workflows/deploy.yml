name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/agribot:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: "13.63.44.196"
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Pull the latest image from Docker Hub
          sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/agribot:latest

          # Stop ALL containers using port 80 (old and new)
          sudo docker ps -q --filter "publish=80" | xargs -r sudo docker stop
          sudo docker ps -aq --filter "name=agribot-app" | xargs -r sudo docker rm
          sudo docker ps -aq --filter "name=musing_panini" | xargs -r sudo docker rm

          # Run the new container
          sudo docker run -d \
            --name agribot-app \
            --restart always \
            -p 80:8000 \
            -e GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
            -e SECRET_KEY=${{ secrets.SECRET_KEY }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/agribot:latest
